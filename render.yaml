services:
  - type: web
    name: unic
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server/index.js
    autoDeploy: true
    envVars:
      - key: REBASE_SEC
        value: "300"
      - key: APY_TARGET
        value: "50000"
      # UNIC_MINT stays unset until $UNIC launches on pools.trade.
      # Set it in the Render dashboard to light up the CA bar.
