services:
  - type: web
    name: uohm
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server/index.js
    autoDeploy: true
    envVars:
      - key: REBASE_SEC
        value: "300"
      - key: APY_TARGET
        value: "50000"
      # UOHM_MINT stays unset until $uOHM launches on pools.trade.
      # Set it in the Render dashboard to light up the CA bar.
